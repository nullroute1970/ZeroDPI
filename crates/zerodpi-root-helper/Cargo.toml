[package]
name = "zerodpi-root-helper"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Privilege-separated Android NFQUEUE helper for ZeroDPI."

[[bin]]
name = "zerodpi-root-helper"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
libc.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
toml.workspace = true
zerodpi-core = { path = "../zerodpi-core" }
zerodpi-helper-protocol = { path = "../zerodpi-helper-protocol" }
zerodpi-platform = { path = "../zerodpi-platform", default-features = false }

[features]
default = ["packet-interception"]
packet-interception = ["zerodpi-platform/packet-interception"]

