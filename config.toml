# ZeroDPI configuration file
# All fields have sensible defaults and can be customized.
# Field names are UPPER_CASE; values follow TOML syntax.

# ---------------------------------------------------------------------------
# Proxy Listener
# ---------------------------------------------------------------------------

# IP address the local TCP proxy listens on.
# Use "0.0.0.0" to accept connections from all interfaces,
# or "127.0.0.1" to restrict to the local machine only.
LISTEN_HOST = "127.0.0.1"

# TCP port the local proxy listens on.
# Point your upstream VPN app (xray-core, sing-box, v2ray, etc.) here
# instead of pointing it directly at your VPN server.
LISTEN_PORT = 44444

# ---------------------------------------------------------------------------
# Operating Mode
# ---------------------------------------------------------------------------

# Operating mode. Valid values: "sni_spoof" (default), "ip_bypass",
# "ip_bypass_plus", "sni_scan", "ip_scan", "proxy_scan".
# - "sni_spoof"     — DPI bypass via SNI spoofing (default).
# - "ip_bypass"     — plain TCP relay through a scanned IP; no packet interception.
# - "ip_bypass_plus" — IPv4 relay through a scanned IP plus real-SNI-preserving
#                      BYPASS_METHOD ("tls_record_frag", "tls_frag",
#                      "tls_padding", "mixed_case_sni", "sni_boundary_frag",
#                      "ccs_prefix",
#                      or "ip_frag").
# - "sni_scan"      — scan sni_list.txt and display/save results, then exit.
# - "ip_scan"       — scan ip_list.txt and display/save results, then exit.
# - "proxy_scan"    — scan sni_list.txt (Phase 1), then test each working SNI
#                     through your V2RayN SOCKS5 mixed port (Phase 2); display
#                     blended results and exit.  Requires V2RayN to be running.
MODE = "sni_spoof"

# When true, ZeroDPI automatically picks the highest-ranked candidate
# after scanning instead of showing the manual selection table.
# TUI progress, results, and dashboard views are still shown.
# For systemd/headless runs, use the CLI flag: --no-tui.
AUTO_SELECT = true

# If set to a hostname, skip the scan entirely and use this hostname as the spoofed SNI.
# The IP address is resolved from DNS automatically.
# Leave as an empty string ("") to use the scanner.
SELECTED_SNI = ""

# If set to a valid IP, skip the IP scan entirely and use this IP directly.
# Leave as an empty string ("") to use the IP scanner.
SELECTED_IP = ""

# ---------------------------------------------------------------------------
# Input Files
# ---------------------------------------------------------------------------

# Path to the file that lists candidate SNI hostnames, one per line.
# Default: "sni_list.txt" (next to config.toml).
SNI_LIST = "sni_list.txt"

# Path to the IP list file (ip_bypass, ip_bypass_plus, and ip_scan modes).
# One entry per line: plain IPs (IPv4 or IPv6) or CIDR ranges.
# ip_bypass_plus is IPv4-only and rejects IPv6 entries.
# Default: "ip_list.txt".
IP_LIST = "ip_list.txt"

# ---------------------------------------------------------------------------
# DNS Resolution
# ---------------------------------------------------------------------------

# By default, ZeroDPI uses the operating system resolver for SNI hostnames.
# Set this to true to send those lookups only to CUSTOM_DNS_SERVER.
CUSTOM_DNS_ENABLED = false

# Plain DNS server used when CUSTOM_DNS_ENABLED is true.
# Accepts a literal IPv4 or IPv6 address with an optional port. Examples:
# "1.1.1.1", "1.1.1.1:5353", "2606:4700:4700::1111",
# or "[2606:4700:4700::1111]:5353". The default port is 53.
CUSTOM_DNS_SERVER = ""

# ---------------------------------------------------------------------------
# Scan Behavior
# ---------------------------------------------------------------------------

# Maximum time (in seconds) each individual probe may take before
# it is abandoned.
SCAN_TIMEOUT_SECS = 5

# How often (in seconds) ZeroDPI re-runs the full SNI scan in the background
# while the proxy is running. In sni_spoof mode, a better top result switches
# the active SNI/IP for new connections. Set to 0 to disable periodic rescanning.
RESCAN_INTERVAL_SECS = 600

# Minimum score required before a background SNI rescan can switch the active
# SNI/IP target.
SNI_SWITCH_MIN_SCORE = 1

# Optional path to write scan results as a JSON file after a scan-only
# run (MODE = "sni_scan" or "ip_scan").
# Leave as an empty string ("") to disable saving.
SCAN_OUTPUT = ""

# ---------------------------------------------------------------------------
# Scanner Tuning
# ---------------------------------------------------------------------------

# Maximum concurrent SNI probes.
SNI_MAX_CONCURRENT = 64

# Maximum concurrent TCP connections in IP phase 1.
IP_MAX_P1_CONCURRENT = 128

# Maximum concurrent TLS probes in IP phase 2.
IP_MAX_P2_CONCURRENT = 32

# Maximum bytes downloaded for speed tests.
SCAN_DOWNLOAD_CAP = 10240

# Maximum bytes uploaded for upload speed tests.
SCAN_UPLOAD_CAP = 10240

# Candidate-relative HTTP path used for upload speed tests.
SCAN_UPLOAD_PATH = "/"

# SNI hostname used *only* during the TLS phase of the IP scan.
IP_SCAN_SNI = "cloudflare.com"

# Maximum number of host addresses expanded from a single IPv6 CIDR block.
IPV6_MAX_HOSTS = 65536

# ---------------------------------------------------------------------------
# Scoring Parameters
# ---------------------------------------------------------------------------

# Maximum valid TCP latency for scoring (ms).
TCP_LATENCY_CAP_MS = 500.0

# Maximum valid TLS latency for scoring (ms).
TLS_LATENCY_CAP_MS = 1000.0

# Maximum valid Time-To-First-Byte for scoring (ms).
TTFB_CAP_MS = 2000.0

# Download speed cap for scoring (bytes/sec).
SPEED_CAP_BPS = 2048000.0

# Upload speed cap for scoring (bytes/sec).
UPLOAD_SPEED_CAP_BPS = 2048000.0

# ---------------------------------------------------------------------------
# Bypass Engine
# ---------------------------------------------------------------------------

# Bypass method(s) to use for SNI-spoof mode.
#
# Accepts a single method name or a list of method names, e.g.:
#
#   BYPASS_METHOD = "wrong_seq"
#   BYPASS_METHOD = ["wrong_seq", "tls_frag"]
#   BYPASS_METHOD = "ccs_prefix"
#
# Base methods:
#
#   "wrong_seq"
#     Waits for the first outbound TCP ACK after the SYN/SYN-ACK exchange,
#     then injects a fake TLS ClientHello on that packet with a deliberately
#     old TCP sequence number.  DPI devices inspect the payload using the
#     allowed SNI; the real upstream server treats the segment as old/duplicate
#     and discards its payload, so the real TLS handshake proceeds unaffected.
#
#   "wrong_checksum"
#     Waits for the first outbound TCP ACK after the SYN/SYN-ACK exchange,
#     then injects a fake TLS ClientHello on that packet with the normal valid
#     TCP sequence number and ACK number.  ZeroDPI computes normal IPv4/TCP
#     checksums first, then deliberately corrupts the TCP checksum.  DPI
#     devices can inspect the payload using the allowed SNI, while the real
#     upstream server drops the invalid-checksum segment before consuming data.
#
#   "wrong_md5"
#     Waits for the first outbound TCP ACK after the SYN/SYN-ACK exchange,
#     then injects a fake TLS ClientHello on that packet with the normal valid
#     TCP sequence number and ACK number plus a TCP-MD5 Signature option.  DPI
#     devices can inspect the payload using the allowed SNI, while the real
#     upstream server rejects the segment because no TCP-MD5 key was negotiated.
#
#   "wrong_ack"
#     Waits for the first outbound TCP ACK after the SYN/SYN-ACK exchange,
#     then injects a fake TLS ClientHello on that packet with the normal valid
#     TCP sequence number and a deliberately old TCP ACK number.  DPI devices
#     can inspect the payload using the allowed SNI, while the real upstream
#     server rejects the segment because its ACK is before the server send
#     window.
#
#   "wrong_timestamp"
#     Waits for the first outbound TCP ACK after the SYN/SYN-ACK exchange,
#     then injects a fake TLS ClientHello on that packet with the normal valid
#     TCP sequence and ACK numbers but a backdated TCP Timestamp TSval.  DPI
#     devices can inspect the payload using the allowed SNI, while the real
#     upstream server rejects the segment as a PAWS replay.
#
#   "low_ttl"
#     TTL-Based Decoy Injection.  Waits for the first outbound TCP ACK after
#     the SYN/SYN-ACK exchange, then injects a fake TLS ClientHello carrying
#     the selected whitelisted SNI on that packet with the normal valid TCP
#     sequence/ACK numbers and a valid checksum, but stamps the IP packet with
#     the LOW_TTL_VALUE.  The TTL is tuned so the decoy reaches an inline DPI
#     middlebox (typically 4-8 hops from the client) but expires before the
#     destination server, so the server never sees the fake payload.  The real
#     handshake still completes because the kernel retransmits the bare ACK.
#     Works best when the DPI is physically closer to the client than the
#     destination server; use "traceroute" or similar to find the middlebox
#     distance and adjust LOW_TTL_VALUE accordingly.
#
#   "tls_record_frag"
#     TLS Record Fragment / TLS-layer fragmentation.  Does NOT inject any fake
#     packet.  Instead, it intercepts the first outbound data packet carrying
#     the real TLS ClientHello, splits the TLS record body, and re-wraps those
#     chunks as multiple small TLS records.  DPI engines that cannot reassemble
#     TLS records across fragment boundaries will fail to extract the SNI.  The
#     upstream TLS server reassembles the fragments normally.
#
#   "fake_tls"
#     Decoy TLS Record Injection.  Injects a decoy TLS record containing a
#     ClientHello with the whitelisted SNI as the first record a
#     record-parsing DPI sees on the data stage.  The decoy is emitted with
#     an out-of-window TCP sequence number, so the upstream server discards
#     it while a TLS-record-parsing DPI inspects it and classifies the flow
#     benign.  The real ClientHello reaches the server via retransmission
#     or, with FAKE_TLS_FORWARD_REAL = true (default), is forwarded
#     immediately after the decoy.  Requires WinDivert/NFQUEUE
#     interception (Administrator/root, IPv4-only).
#
#   "ip_frag"
#     IP-Layer Fragment.  Splits the first outbound data packet (the real
#     ClientHello) into small IPv4 fragments.  The server's kernel
#     reassembles them before TLS, so the handshake proceeds normally; DPIs
#     that do not reassemble IP fragments never see the SNI.  With
#     IP_FRAG_ONLY_FIRST_PACKET = false, every outbound data packet is
#     fragmented.  Requires WinDivert/NFQUEUE interception
#     (Administrator/root, IPv4-only).
#
#   "urg_sni_split"
#     TCP Urgent + SNI byte splice.  Does NOT inject any fake packet.  Instead,
#     it intercepts the first outbound data packet carrying the real TLS
#     ClientHello, splices a single dummy byte (SNI_SPLIT_DUMMY_BYTE) into the
#     middle of the SNI domain string (at SNI_SPLIT_POSITION), and sets the TCP
#     URG flag with the urgent pointer marking the dummy byte.  BSD-style
#     destination stacks extract the urgent byte from the stream, so the server
#     still receives the original ClientHello; DPI middleboxes that read the
#     raw byte stream sequentially see a mangled SNI instead.
#
#   "tls_frag"
#     TLS Fragment / TCP-level fragmentation.  Does NOT inject fake packets
#     and does NOT use WinDivert or NFQUEUE packet interception.  Instead, it
#     fragments the first TLS ClientHello record or a configured range of
#     client-to-upstream data writes using TLS_FRAG_PACKETS, TLS_FRAG_LENGTH,
#     and TLS_FRAG_INTERVAL_MS.  With TCP_NODELAY enabled, the OS is less
#     likely to coalesce small writes, so no single packet carries the full
#     SNI.  The upstream server reassembles the stream normally.
#
#   "tls_padding"
#     TLS ClientHello Padding Expansion (RFC 7685).  Does NOT inject fake
#     packets and does NOT use WinDivert or NFQUEUE packet interception.
#     Instead it inserts a padding extension (type 0x0015) filled with
#     TLS_PADDING_SIZE zero bytes into the client's real TLS ClientHello.
#     With TLS_PADDING_POSITION = "before" (default) the padding is inserted
#     immediately before the SNI extension, pushing the SNI bytes past the
#     DPI's inspection window (typically 512, 1024, or 1460 bytes); the
#     destination server still parses the full record and skips the unknown
#     extension.  "after" appends the padding at the end of the extension
#     list instead.
#
#   "mixed_case_sni"
#     SNI Case Randomization.  Does NOT inject fake packets and does NOT use
#     WinDivert or NFQUEUE packet interception.  Randomizes the ASCII letter
#     case of the hostname inside the SNI extension of the client's real TLS
#     ClientHello (e.g. wikipedia.org -> wIkIpeDiA.oRg).  Per RFC 6066 the
#     SNI hostname is case-insensitive: destination servers lowercase it
#     during lookup, so the handshake completes normally, while DPI that
#     matches blocklists with exact case-sensitive string comparisons misses
#     the name.  Digits, dots, and hyphens are never changed (safe for
#     punycode SNIs).
#
#   "sni_boundary_frag"
#     SNI Extension Boundary Fragmentation.  Does NOT inject fake packets
#     and does NOT use WinDivert or NFQUEUE packet interception.  Parses the
#     real TLS ClientHello down to the extension array and writes the first
#     record as exactly two TCP segments cut at the SNI extension boundary
#     (SNI_BOUNDARY_FRAG_SPLIT_POINT), with a small delay between them
#     (SNI_BOUNDARY_FRAG_DELAY_MS) so inline DPI reassembly buffers do not
#     stitch them back together.  The upstream server reassembles the
#     segments into an identical ClientHello.
#
#   "ccs_prefix"
#     TLS 1.3 Middlebox-Compat ChangeCipherSpec Prefix.  Does NOT inject fake
#     packets and does NOT use WinDivert or NFQUEUE packet interception.
#     Writes a dummy ChangeCipherSpec record (14 03 03 00 01 01, version
#     bytes configurable via CCS_PREFIX_RECORD_VERSION) as the very first
#     bytes of the upstream stream, before the real ClientHello.  TLS 1.3
#     servers treat a ChangeCipherSpec received before their first Finished
#     as a no-op (RFC 8446 §4.1.3, §5.5), so the handshake proceeds; DPIs
#     that classify on the first TLS record see a benign CCS instead of the
#     ClientHello.  TLS 1.2 servers are not required to tolerate the prefix.
#
# Common combinations (written as lists):
#
#   ["wrong_seq", "wrong_md5"]        -> fake ClientHello with old TCP seq + TCP-MD5
#   ["wrong_seq", "tls_frag"]         -> fake ClientHello + TCP-level fragmentation (default)
#   ["wrong_md5", "tls_frag"]         -> TCP-MD5 fake ClientHello + TCP-level fragmentation
#   ["wrong_seq", "tls_record_frag"]  -> fake ClientHello + TLS-record fragmentation
#
# Combining methods:
#
# - Handshake-stage methods (wrong_seq, wrong_ack, wrong_checksum, wrong_md5,
#   wrong_timestamp, low_ttl) all inject the same fake ClientHello; when
#   several are listed they merge their tricks onto that one fake packet.
#   PSH / IPv4-Identification behavior comes from the first listed method;
#   completion behavior comes from the last listed method.
# - "tls_record_frag" and/or "tls_frag" add the data stage after the fake
#   packet: TLS-record fragmentation inside the interceptor and TCP-level
#   write segmentation inside the proxy respectively.  A list containing
#   "tls_frag" alongside other methods still uses packet interception.
# - "fake_tls" adds a data-stage decoy injection.  It combines with
#   handshake-stage fake-packet methods and with the socket-side methods,
#   but is mutually exclusive with "tls_record_frag" and "urg_sni_split"
#   (all three own the first data packet).
# - "ip_frag" adds a data-stage IP fragmentation.  It combines with
#   handshake-stage fake-packet methods and with the socket-side methods,
#   but is mutually exclusive with "tls_record_frag", "fake_tls", and
#   "urg_sni_split" (all own the first data packet).
# - "tls_padding" adds a socket-side data stage: the real ClientHello is
#   expanded with an RFC 7685 padding extension before it is written to the
#   upstream socket.  It combines with handshake-stage methods and with
#   "tls_frag" (pad first, then fragment).
# - "mixed_case_sni" adds a socket-side data stage that randomizes the
#   SNI case in the real ClientHello.  It combines with handshake-stage
#   methods, with "tls_frag", and with "tls_padding" (pad first, then
#   randomize).
# - "sni_boundary_frag" adds a socket-side data stage that writes the real
#   ClientHello as exactly two TCP segments cut at the SNI extension
#   boundary.  It combines with handshake-stage methods and with "tls_frag",
#   "tls_padding", and "mixed_case_sni".
# - "ccs_prefix" adds a socket-side prefix stage that writes a dummy
#   ChangeCipherSpec record as the very first upstream bytes.  It combines
#   with handshake-stage methods and with every socket-side method.
# - A list containing only "tls_frag", "tls_padding", "mixed_case_sni",
#   "sni_boundary_frag", and/or "ccs_prefix" skips the packet interceptor
#   entirely.
#
# Limitations:
#
# - The list must not be empty and must not contain duplicate method names
#   (after alias expansion).
# - "urg_sni_split" can only be used alone or together with "tls_frag" /
#   "tls_record_frag"; it cannot be combined with other handshake-stage
#   methods.
# - "sni_boundary_frag" cannot be combined with "tls_record_frag" or
#   "urg_sni_split"; it combines with the handshake fake-packet methods and
#   with "tls_frag", "tls_padding", and "mixed_case_sni".
# - "fake_tls" cannot be combined with "tls_record_frag" or
#   "urg_sni_split".
# - "ip_frag" cannot be combined with "tls_record_frag", "fake_tls", or
#   "urg_sni_split".
# - MODE = "ip_bypass_plus" supports only "tls_record_frag", "tls_frag",
#   "tls_padding", "mixed_case_sni", "sni_boundary_frag", "ccs_prefix",
#   or "ip_frag" so the upstream VPN client's real SNI is preserved.
# - LOW_TTL_DISCOVER only takes effect when "low_ttl" is in the list;
#   otherwise discovery is silently skipped.
#
# This setting is used by SNI-based modes ("sni_spoof", "sni_scan", and
# "proxy_scan").  The "ip_bypass" and "ip_scan" modes do not use a bypass
# method.
#
BYPASS_METHOD = ["wrong_seq", "tls_frag"]

# Seconds the proxy waits for the intercept thread to confirm that the spoofed
# packet was acknowledged and the bypass phase completed.
#
# Increase this on very high-latency links or slow systems if otherwise valid
# connections time out during startup.  Lower values fail faster when the
# bypass cannot complete.  Must be at least 1.
BYPASS_TIMEOUT_SECS = 20

# Maximum lifetime (in seconds) for an established relay before ZeroDPI closes
# it and lets the upstream VPN client reconnect. This is useful for protocols
# such as gRPC that keep one TCP/TLS connection open for hours; reconnecting
# lets new connections use the latest scanned SNI/IP target.
#
# Set to 0 to disable relay rotation. This is the default.
RELAY_MAX_LIFETIME_SECS = 0

# (Linux only) NFQUEUE queue number used to intercept packets.
#
# ZeroDPI installs firewall rules that send selected TCP packets to this queue.
# If you change this value, the queue number in the installed rules must match.
# Windows builds use WinDivert instead, so this setting has no effect there.
NFQUEUE_NUM = 1

# (Linux only) Firewall rule backend used for NFQUEUE interception.
#
# Valid values:
#   "iptables" — legacy/default behavior.
#   "nftables" — use the nft command and an inet table.
# Windows builds use WinDivert instead, so this setting has no effect there.
LINUX_FIREWALL_BACKEND = "iptables"

# ---------------------------------------------------------------------------
# wrong_seq method parameters
# ---------------------------------------------------------------------------
# These settings apply when BYPASS_METHOD = "wrong_seq", or when "wrong_seq"
# is combined with "wrong_md5", "tls_frag", or "tls_record_frag".

# Extra bytes subtracted from the injected TCP sequence number in addition to
# the spoofed ClientHello payload length.
#
# The default formula is:
#   injected_seq = syn_seq + 1 - payload_len - WRONG_SEQ_EXTRA_OFFSET
#
# With the default value of 0, the fake segment is placed exactly one payload
# length behind the server's expected receive sequence.  A positive value pushes
# the fake segment farther behind the receive window, which can help on some
# networks with stricter TCP window checks.  Start with 0 and only increase it
# when testing shows the default is not effective.
WRONG_SEQ_EXTRA_OFFSET = 0

# Whether to set the TCP PSH flag on the spoofed ClientHello packet.
#
# Keep this enabled for normal use.  Many DPI implementations treat PSH-marked
# packets as application data that should be inspected immediately.  Disable it
# only when testing a network or middlebox that reacts poorly to PSH.
WRONG_SEQ_SET_PSH = true

# Whether to increment the IPv4 Identification field on the spoofed packet.
#
# Bumping the ID makes the injected packet look like a fresh IPv4 datagram
# rather than a retransmission of a previous packet.  This helps some stateful
# middleboxes accept and inspect the fake ClientHello.  This only affects IPv4
# packets; IPv6 has no IPv4 Identification field.
WRONG_SEQ_BUMP_IP_IDENT = true

# ---------------------------------------------------------------------------
# wrong_checksum method parameters
# ---------------------------------------------------------------------------
# These settings only apply when BYPASS_METHOD = "wrong_checksum".

# Non-zero value added to the valid computed TCP checksum on the spoofed
# ClientHello packet.
#
# ZeroDPI first rebuilds the packet with correct IPv4/TCP checksums, then
# corrupts the TCP checksum by wrapping-addition with this value.  DPI engines
# that do not verify TCP checksums can still parse the fake ClientHello, while
# the real upstream server should silently drop it.
#
# Must be >= 1.  Default: 1.
WRONG_CHECKSUM_DELTA = 1

# Whether to set the TCP PSH flag on the spoofed ClientHello packet.
#
# Keep this enabled for normal use.  Disable it only when testing a network or
# middlebox that reacts poorly to PSH.
WRONG_CHECKSUM_SET_PSH = true

# Whether to increment the IPv4 Identification field on the spoofed packet.
#
# Bumping the ID makes the spoofed packet look like a fresh IPv4 datagram.
# This only affects IPv4 packets; IPv6 has no IPv4 Identification field.
WRONG_CHECKSUM_BUMP_IP_IDENT = true

# Whether to signal the bypass phase complete immediately after the corrupted
# packet is emitted.
#
# The default is true because a correctly invalid-checksum packet should be
# dropped silently by the real server and therefore will not produce an ACK.
WRONG_CHECKSUM_COMPLETE_IMMEDIATELY = true

# ---------------------------------------------------------------------------
# low_ttl method parameters
# ---------------------------------------------------------------------------
# These settings apply when BYPASS_METHOD = "low_ttl".

# IPv4 Time-To-Live stamped on the spoofed decoy ClientHello packet.
#
# The decoy carries the selected whitelisted SNI from the SNI scan.  Set this
# high enough that the packet reaches the ISP's inline DPI middlebox, but low
# enough that it expires before reaching the destination server.  Typical DPI
# middleboxes sit 4 to 8 hops from the client; find the exact distance with
# "traceroute" and tune from there.  If the value is too high, the real server
# receives the decoy payload; if too low, the DPI never sees it.
#
# Must be between 1 and 64.  Default: 5.
LOW_TTL_VALUE = 5

# Whether to set the TCP PSH flag on the spoofed decoy ClientHello packet.
#
# Keep this enabled for normal use.  Disable it only when testing a network or
# middlebox that reacts poorly to PSH.
LOW_TTL_SET_PSH = true

# Whether to increment the IPv4 Identification field on the spoofed packet.
#
# Bumping the ID makes the spoofed packet look like a fresh IPv4 datagram.
# This only affects IPv4 packets; IPv6 has no IPv4 Identification field.
LOW_TTL_BUMP_IP_IDENT = true

# Whether to signal the bypass phase complete immediately after the low-TTL
# packet is emitted.
#
# The default is true because the segment is expected to expire before reaching
# the server and therefore will not produce an ACK; the real handshake
# completes via TCP retransmission instead.
LOW_TTL_COMPLETE_IMMEDIATELY = true

# Whether to automatically discover the correct LOW_TTL_VALUE at startup and
# again whenever a background rescan switches the active SNI/IP target.
#
# Discovery probes TTL candidates from 1 up to LOW_TTL_DISCOVER_MAX, running
# the real bypass machinery end-to-end for each candidate (decoy ClientHello
# + full TLS handshake), and applies the largest working value: the server's
# hop distance minus one, which reaches any inline DPI middlebox with maximum
# margin.  Probing uses per-flow TTL overrides, so live connections are never
# disturbed; on a rescan the target hot-swap happens only after discovery
# succeeds (failure keeps the current target and TTL).  It requires
# LOW_TTL_COMPLETE_IMMEDIATELY = true, and only runs when "low_ttl" is in
# the BYPASS_METHOD list.  It adds a startup delay (a few seconds up to ~30 s
# worst case) and can extend a rescan cycle by up to LOW_TTL_DISCOVER_MAX ×
# LOW_TTL_DISCOVER_TIMEOUT_MS.
#
# Default: true.
LOW_TTL_DISCOVER = true

# Upper bound of the LOW_TTL_DISCOVER search range, bounding the worst-case
# discovery delay (startup or rescan).  Must be between 1 and 64.  Default: 32.
LOW_TTL_DISCOVER_MAX = 32

# Per-candidate timeout in milliseconds used while discovering LOW_TTL_VALUE.
# Lower values speed up discovery but may cause false negatives on slow links.
# Must be at least 100.  Default: 5000.
LOW_TTL_DISCOVER_TIMEOUT_MS = 5000

# ---------------------------------------------------------------------------
# wrong_md5 method parameters
# ---------------------------------------------------------------------------
# These settings apply when BYPASS_METHOD = "wrong_md5" or when "wrong_md5"
# is combined with "tls_frag". In a ["wrong_seq", "wrong_md5"] combination,
# this group provides the TCP-MD5 option and WRONG_MD5_COMPLETE_IMMEDIATELY,
# while the wrong_seq PSH/IP-ident settings control packet shape.
# WRONG_MD5_COMPLETE_IMMEDIATELY does not affect a ["wrong_md5", "tls_frag"]
# combination; it waits for the real ClientHello segmentation stage.

# Whether to set the TCP PSH flag on the spoofed TCP-MD5 ClientHello packet.
#
# Keep this enabled for normal use.  Disable it only when testing a network or
# middlebox that reacts poorly to PSH.
WRONG_MD5_SET_PSH = true

# Whether to increment the IPv4 Identification field on the spoofed TCP-MD5
# packet.
#
# Bumping the ID makes the spoofed packet look like a fresh IPv4 datagram.
# This only affects IPv4 packets; IPv6 has no IPv4 Identification field.
WRONG_MD5_BUMP_IP_IDENT = true

# Whether to signal the bypass phase complete immediately after the TCP-MD5
# packet is emitted.
#
# The default is true because a server without a negotiated TCP-MD5 key should
# reject or drop the forged segment.
WRONG_MD5_COMPLETE_IMMEDIATELY = true

# ---------------------------------------------------------------------------
# wrong_ack method parameters
# ---------------------------------------------------------------------------
# These settings only apply when BYPASS_METHOD = "wrong_ack".

# Bytes subtracted from syn_ack_seq + 1 for the spoofed TCP ACK number.
#
# With the default value of 1, the fake segment's ACK is placed one byte before
# the server's current send-window left edge:
#   injected_ack = syn_ack_seq + 1 - WRONG_ACK_OFFSET
#
# Increase only when testing shows the default is not effective.
#
# Must be >= 1.  Default: 1.
WRONG_ACK_OFFSET = 1

# Whether to set the TCP PSH flag on the spoofed ClientHello packet.
#
# Keep this enabled for normal use.  Disable it only when testing a network or
# middlebox that reacts poorly to PSH.
WRONG_ACK_SET_PSH = true

# Whether to increment the IPv4 Identification field on the spoofed packet.
#
# Bumping the ID makes the spoofed packet look like a fresh IPv4 datagram.
# This only affects IPv4 packets; IPv6 has no IPv4 Identification field.
WRONG_ACK_BUMP_IP_IDENT = true

# Whether to signal the bypass phase complete immediately after the old-ACK
# packet is emitted.
#
# The default is true because out-of-window ACK handling can be dropped or
# answered inconsistently by real servers.
WRONG_ACK_COMPLETE_IMMEDIATELY = true

# ---------------------------------------------------------------------------
# wrong_timestamp method parameters
# ---------------------------------------------------------------------------
# These settings only apply when BYPASS_METHOD = "wrong_timestamp".

# Value subtracted from the captured TCP Timestamp TSval on the spoofed
# ClientHello packet.
#
# With the default value of 1, the fake segment's timestamp is one tick older
# than the timestamp the server has already seen from this flow, so PAWS should
# reject it as a replay.  Increase only when testing shows the default is not
# effective.
#
# Must be >= 1.  Default: 1.
WRONG_TIMESTAMP_OFFSET = 1

# Whether to set the TCP PSH flag on the spoofed ClientHello packet.
#
# Keep this enabled for normal use.  Disable it only when testing a network or
# middlebox that reacts poorly to PSH.
WRONG_TIMESTAMP_SET_PSH = true

# Whether to increment the IPv4 Identification field on the spoofed packet.
#
# Bumping the ID makes the spoofed packet look like a fresh IPv4 datagram.
# This only affects IPv4 packets; IPv6 has no IPv4 Identification field.
WRONG_TIMESTAMP_BUMP_IP_IDENT = true

# Whether to signal the bypass phase complete immediately after the
# backdated-timestamp packet is emitted.
#
# The default is true because a PAWS-rejected packet should not be acknowledged
# as new data by the real server.
WRONG_TIMESTAMP_COMPLETE_IMMEDIATELY = true

# ---------------------------------------------------------------------------
# tls_record_frag method parameters
# ---------------------------------------------------------------------------
# These settings apply when BYPASS_METHOD = "tls_record_frag" or when
# "tls_record_frag" is combined with "wrong_seq".

# Maximum number of TLS record body bytes placed in each TLS record fragment.
#
# The real TLS ClientHello record body is split into chunks of at most this
# many bytes.  Each chunk is wrapped in its own 5-byte TLS record header and
# the results are concatenated into a single TCP segment.  The upstream server
# reassembles the records into an identical ClientHello.
#
# Smaller values produce more fragments and are harder for DPI to reassemble:
#   1  — one body byte per record (most aggressive, maximum fragmentation)
#   5  — five body bytes per record
#   128 — moderate fragmentation, balances effectiveness and overhead
#
# Must be >= 1.  Default: 1.
TLS_RECORD_FRAG_SIZE = 1

# Whether to set the TCP PSH flag on the packet carrying the fragmented
# ClientHello.
#
# PSH signals to the receiver that it should pass the data to the application
# immediately.  Keep this enabled for normal use.  Disable it only when
# debugging a specific DPI device that reacts poorly to PSH-marked packets.
TLS_RECORD_FRAG_SET_PSH = true

# Whether to increment the IPv4 Identification field on the packet carrying
# the fragmented ClientHello.
#
# Bumping the ID makes the modified packet look like a fresh IPv4 datagram
# rather than a retransmission.  This only affects IPv4 packets; IPv6 has
# no IPv4 Identification field.
TLS_RECORD_FRAG_BUMP_IP_IDENT = true

# ---------------------------------------------------------------------------
# fake_tls method parameters
# ---------------------------------------------------------------------------
# These settings apply when BYPASS_METHOD = "fake_tls" (alone or combined
# with handshake fake-packet methods or socket-side methods).
#
# fake_tls injects a decoy TLS record carrying the whitelisted SNI at the
# first outbound data packet, with a TCP sequence number placed behind the
# server's receive window.  A record-parsing DPI inspects the decoy and
# classifies the flow benign; the real server discards the out-of-window
# segment and processes the genuine ClientHello (delivered by TCP
# retransmission, or forwarded immediately after the decoy when
# FAKE_TLS_FORWARD_REAL is true).

# Extra bytes subtracted from the decoy's injected TCP sequence number in
# addition to the decoy payload length.
#
# The default formula is:
#   injected_seq = syn_seq + 1 - payload_len - FAKE_TLS_EXTRA_OFFSET
#
# With the default value of 0, the decoy is placed exactly one payload
# length behind the server's expected receive sequence.  A positive value
# pushes the decoy farther behind the receive window.  Start with 0.
FAKE_TLS_EXTRA_OFFSET = 0

# Whether to set the TCP PSH flag on the decoy record packet.
#
# Keep this enabled for normal use.  Many DPI implementations treat
# PSH-marked packets as application data that should be inspected
# immediately.
FAKE_TLS_SET_PSH = true

# Whether to increment the IPv4 Identification field on the decoy packet.
#
# Bumping the ID makes the injected packet look like a fresh IPv4 datagram
# rather than a retransmission.  This only affects IPv4 packets.
FAKE_TLS_BUMP_IP_IDENT = true

# Whether to signal the bypass phase complete immediately after the decoy
# record is emitted.
#
# The default is true: the out-of-window decoy is never acknowledged by the
# real server, so waiting for an ACK would only delay the relay.  Set this
# to false to wait for the server to acknowledge the first data packet
# before releasing the flow.
FAKE_TLS_COMPLETE_IMMEDIATELY = true

# Whether to forward the original first data packet (the real ClientHello)
# immediately after the decoy record is emitted.
#
# true (default)  — dual emission: the decoy goes out, then the real
#                   ClientHello follows immediately.  No added latency.
#                   WinDivert sends both packets; on Linux/Android the decoy
#                   is injected through a raw socket (root).  If the raw
#                   socket is unavailable, ZeroDPI logs a warning and falls
#                   back to single-packet mode.
# false           — the first data packet itself becomes the decoy; the real
#                   ClientHello reaches the server via TCP retransmission
#                   (adds roughly one retransmission timeout, ~200 ms).
FAKE_TLS_FORWARD_REAL = true

# ---------------------------------------------------------------------------
# ip_frag method parameters
# ---------------------------------------------------------------------------
# These settings apply when BYPASS_METHOD = "ip_frag" (alone or combined
# with handshake fake-packet methods or socket-side methods).
#
# ip_frag splits the outbound data packet carrying the ClientHello at the
# IPv4 layer into fragments of at most IP_FRAG_SIZE payload bytes.  The
# destination kernel reassembles the fragments before the TLS stack sees
# the stream, so the handshake is unaffected; inline DPIs that do not
# reassemble IP fragments never see a complete ClientHello.  The real
# ClientHello bytes are untouched — the SNI is preserved.

# Maximum IP payload bytes (TCP header + TCP payload) per fragment.
#
# Fragment offsets are expressed in 8-byte units, so this value must be a
# multiple of 8 and at least 8.  Default: 24.
IP_FRAG_SIZE = 24

# Whether to fragment only the first outbound data packet of each
# connection.
#
# true (default)  — fragment the packet carrying the ClientHello only; the
#                   rest of the stream is untouched.
# false           — fragment-all mode: every subsequent outbound data packet
#                   is also fragmented until the connection closes.  Costs
#                   CPU per packet and raises the chance a fragment-hostile
#                   middlebox breaks the flow; use only when the DPI
#                   reassembles only the first packet.
IP_FRAG_ONLY_FIRST_PACKET = true

# ---------------------------------------------------------------------------
# urg_sni_split method parameters
# ---------------------------------------------------------------------------
# These settings apply when BYPASS_METHOD = "urg_sni_split".

# The 1-byte dummy payload inserted into the middle of the SNI domain string
# of the real ClientHello.  The packet's TCP URG flag marks this byte as
# urgent data: BSD-style destination stacks extract it from the stream, so the
# server still sees the original SNI, while DPI middleboxes that read the raw
# byte stream see a mangled name.  Default: 0.
SNI_SPLIT_DUMMY_BYTE = 0

# Where inside the SNI domain string the dummy byte is inserted.
#   "middle" — exact middle of the name (default)
#   "start"  — before the first name byte
#   "end"    — before the last name byte
#   N        — 0-based index into the name, clamped to the last byte
SNI_SPLIT_POSITION = "middle"

# ---------------------------------------------------------------------------
# sni_boundary_frag method parameters
# ---------------------------------------------------------------------------
# These settings apply when BYPASS_METHOD = "sni_boundary_frag" (alone or
# combined with tls_frag / tls_padding / mixed_case_sni / fake_tls or the
# handshake fake-packet methods wrong_seq, wrong_ack, wrong_checksum,
# wrong_md5, wrong_timestamp, low_ttl).
#
# Unlike wrong_seq and tls_record_frag, this method does NOT use the
# WinDivert / NFQUEUE packet interceptor when combined only with other
# socket-side methods.  In combos with fake-packet methods, the fake packet
# stage still requires packet interception, while these settings control how
# the real ClientHello is written after the fake packet stage.
#
# The proxy parses the ClientHello down to the extension array, computes the
# exact byte offset of the SNI extension, and writes the ClientHello as two
# TCP segments cut at that boundary, with a small delay between them so
# inline DPI reassembly buffers do not stitch them back together.

# Where to cut the first ClientHello TCP write.
#   "extension_length" — right after the server_name extension's 2-byte
#                        length field; segment 2 starts with the extension
#                        body (default)
#   "middle"           — exact middle of the SNI domain string
#                        (e.g. https://you | tube.com)
#   N                  — after the Nth byte of the domain string (0-based),
#                        clamped to the domain length
SNI_BOUNDARY_FRAG_SPLIT_POINT = "extension_length"

# Delay between the two TCP segments, in milliseconds.
#
# Accepts either a fixed integer or an inclusive range string:
#   5        — always wait 5 ms
#   "5-10"   — randomly choose 5 through 10 ms per connection
#   0        — send both segments back-to-back
#
# A fresh value is chosen per connection.
#
# Must be >= 0.  Default: "5-10".
SNI_BOUNDARY_FRAG_DELAY_MS = "5-10"

# ---------------------------------------------------------------------------
# tls_frag method parameters
# ---------------------------------------------------------------------------
# These settings apply when BYPASS_METHOD = "tls_frag" or when "tls_frag" is
# combined with "wrong_seq" or "wrong_md5".
#
# Unlike "wrong_seq" and "tls_record_frag", this method does NOT use the
# WinDivert / NFQUEUE packet interceptor when used alone as "tls_frag".
# In combo methods, the fake packet stage still requires packet interception,
# while these TCP segment settings control how the real
# ClientHello is written after the fake packet stage.

# Which client data to fragment.
#
# Supported values:
#   "tlshello" — fragment the first complete TLS record (the ClientHello).
#   "1-3"      — fragment the 1st through 3rd client-to-upstream data writes
#                observed by ZeroDPI.
#
# Default: "1-3".
TLS_FRAG_PACKETS = "1-3"

# Fragment length range in bytes.
#
# Accepts either a fixed integer or an inclusive range string:
#   1     — one byte per fragment chunk
#   "1-5" — randomly choose 1 through 5 bytes for each chunk
#   128   — moderate fragmentation
#
# A fresh value is chosen for each fragment chunk. Smaller values produce more
# chunks and are harder for DPI to reassemble, at the cost of connection-start
# overhead. If this field is omitted, ZeroDPI uses the default range below.
#
# Must be >= 1.  Default: "100-200".
TLS_FRAG_LENGTH = "100-200"

# Delay between fragment chunks, in milliseconds.
#
# Accepts either a fixed integer or an inclusive range string:
#   0      — write chunks back-to-back
#   "0-10" — randomly wait 0 through 10 ms between chunks
#   5      — wait 5 ms between chunks
#
# A fresh value is chosen between each pair of chunks. ZeroDPI does not sleep
# after the last chunk.
#
# Must be >= 0.  Default: "10-20".
TLS_FRAG_INTERVAL_MS = "10-20"

# ---------------------------------------------------------------------------
# tls_padding method parameters
# ---------------------------------------------------------------------------
# These settings apply when BYPASS_METHOD = "tls_padding" (alone or combined).

# Zero-byte count of the RFC 7685 padding extension inserted into the first
# TLS ClientHello record.
#
# Accepts either a fixed integer or an inclusive range string:
#   1500        — always insert 1500 zero bytes
#   "1500-2500" — randomly choose 1500 through 2500 bytes per connection
#
# A fresh value is chosen per connection.  The padding is clamped at runtime
# so the final TLS record never exceeds 16383 bytes (the TLS record-layer
# maximum).  Larger values push the SNI further past the DPI's inspection
# window (typically 512, 1024, or 1460 bytes).
#
# Must be >= 1 and <= 16000.  Default: "1500-2500".
TLS_PADDING_SIZE = "1500-2500"

# Where the padding extension is inserted inside the ClientHello extensions.
#   "before" — immediately before the SNI extension, pushing the SNI bytes
#              past the DPI's inspection window (default)
#   "after"  — at the end of the extension list (canonical RFC 7685 placement)
TLS_PADDING_POSITION = "before"

# ---------------------------------------------------------------------------
# mixed_case_sni method parameters
# ---------------------------------------------------------------------------
# These settings apply when BYPASS_METHOD = "mixed_case_sni" (alone or
# combined).

# When true, every ASCII letter in the SNI hostname is case-inverted
# (a -> A, A -> a).  When false (default), each letter is randomly
# uppercased or lowercased per connection, with at least one letter
# guaranteed to differ from the original.
MIXED_CASE_SNI_FLIP_ALL = false

# ---------------------------------------------------------------------------
# ccs_prefix method parameters
# ---------------------------------------------------------------------------
# These settings apply when BYPASS_METHOD = "ccs_prefix" (alone or combined).

# The two TLS record-version bytes of the dummy ChangeCipherSpec record, as a
# hex string.  TLS 1.3's middlebox compatibility mode uses 0x0303; change
# this only when a DPI fingerprints on the record version.
CCS_PREFIX_RECORD_VERSION = "0x0303"

# Legacy fixed fragment length fallback.
#
# Existing configs that explicitly omit TLS_FRAG_LENGTH in code can keep using
# TCP_SEG_SIZE. New configs should prefer TLS_FRAG_LENGTH because it supports
# Xray-style ranges.
#
# Used only when TLS_FRAG_LENGTH is omitted. Must be >= 1. Default: 1.
TCP_SEG_SIZE = 1

# Whether to set TCP_NODELAY on the upstream socket before writing the
# fragmented ClientHello or selected client writes.
#
# TCP_NODELAY disables Nagle's algorithm, which would otherwise accumulate
# small writes into a single large TCP segment and completely defeat this
# bypass method.  Keep this enabled for normal TCP-segmentation use.
#
# Set to false only when debugging a specific network or middlebox that
# reacts poorly to TCP_NODELAY connections.
TCP_SEG_NODELAY = true

# ---------------------------------------------------------------------------
# Proxy Scan Mode
# ---------------------------------------------------------------------------
# These settings only apply when MODE = "proxy_scan".
# proxy_scan first runs the standard SNI scan (Phase 1) then tests each
# passing candidate end-to-end through your VPN proxy (Phase 2).

# Minimum SNI-scan score (0–100) a candidate must reach in Phase 1 to
# be eligible for the proxy test in Phase 2.
# Default: 1 (any candidate that scored any points proceeds).
PROXY_TEST_MIN_SNI_SCORE = 1

# Maximum number of Phase 1 candidates to carry into Phase 2.
# 0 = no cap (test all passing candidates).
# Default: 0.
PROXY_TEST_TOP_N = 0

# Host of the SOCKS5 mixed proxy (V2RayN default).
PROXY_TEST_SOCKS5_HOST = "127.0.0.1"

# Port of the SOCKS5 mixed proxy (V2RayN default).
PROXY_TEST_SOCKS5_PORT = 10808

# HTTPS URL to fetch through the proxy for speed / latency measurement.
# Must be an HTTPS URL.  The Cloudflare speed endpoint below downloads a
# fixed ~512 KB chunk — ideal for measuring real-world VPN throughput.
PROXY_TEST_URL = "https://speed.cloudflare.com/__down?bytes=524288"

# Timeout for each individual proxy test probe (seconds).
# Increase on very slow or high-latency VPN links.
PROXY_TEST_TIMEOUT_SECS = 30

# Weight (0.0–1.0) given to the Phase 1 SNI-scan score when computing the
# blended final score.  The proxy-test score weight = 1.0 - this value.
# 0.5 = equal blend; 1.0 = SNI score only; 0.0 = proxy score only.
PROXY_TEST_SNI_WEIGHT = 0.5

# Scoring caps for the Phase 2 proxy test.
# These mirror SCAN_* caps but apply to the proxy-measured values.

# TCP latency cap to the SOCKS5 proxy (ms).  Latency above this → 0 pts.
PROXY_TEST_LATENCY_CAP_MS = 500.0

# TTFB cap through the proxy (ms).  TTFB above this → 0 pts.
PROXY_TEST_TTFB_CAP_MS = 3000.0

# Download speed cap through the proxy (bytes/sec).  Speed above this → max pts.
PROXY_TEST_SPEED_CAP_BPS = 2048000.0
