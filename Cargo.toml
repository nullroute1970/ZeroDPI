[workspace]
resolver = "2"
members = [
    "crates/zerodpi-core",
    "crates/zerodpi-platform",
    "crates/zerodpi",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.100"
license = "MIT"
authors = ["ZeroDPI contributors"]
repository = "https://github.com/mhdr/ZeroDPI"

[workspace.dependencies]
anyhow = "1.0.104"
thiserror = "2.0.21"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.2.1"
tokio = { version = "~1.53.3", features = ["rt-multi-thread", "net", "macros", "io-util", "sync", "time", "signal"] }
clap = { version = "4.6.8", features = ["derive"] }
dashmap = "6.2.1"
etherparse = "0.20.3"
parking_lot = "0.13.0"
ratatui = "0.30.2"
crossterm = "0.29"
rustls = { version = "0.23.46", default-features = false, features = ["ring", "tls12", "std"] }
tokio-rustls = "0.26.6"
webpki-roots = "1.0.12"
hickory-resolver = { version = "0.26.3", default-features = false, features = ["tokio"] }
ipnet = "2.12.2"
tempfile = "3"
libc = "0.2.191"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
